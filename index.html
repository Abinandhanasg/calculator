<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>

    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;

            background: url("https://www.shutterstock.com/image-photo/pen-on-tax-form-blur-260nw-348485753.jpg")
                        no-repeat center center fixed;
            background-size: cover;
        }

        .open-btn {
            padding: 15px 35px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #5300ff, #b300ff);
            color: white;
            cursor: pointer;
            margin-bottom: 25px;
            transition: 0.3s;
        }

        .open-btn:hover {
            transform: scale(1.06);
        }

        .calc-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            width: 800px;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            display: none; 
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .calc-title {
            text-align: center;
            color: black;       
            margin-bottom: 20px;
            font-size: 40px;
            font-weight: bold;
        }

        .screen {
            height: 110px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            color: white;
            font-size: 48px;
            padding: 25px;
            text-align: right;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .calc-btn {
            height: 90px;
            border: none;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            background: rgba(255,255,255,0.85);
            color: black;
            cursor: pointer;
            transition: 0.2s;
        }

        .calc-btn:hover {
            transform: scale(1.05);
            background: white;
        }

        .operator {
            background: linear-gradient(90deg, #ff512f, #dd2476);
            color: white !important;
        }

        .equal {
            background: linear-gradient(90deg, #5300ff, #b300ff);
            color: white !important;
        }

    </style>
</head>

<body>

    <button class="open-btn" id="openBtn" onclick="showCalculator()">Open Calculator</button>

    
    <div class="calc-container" id="calculator">

        <h2 class="calc-title">Calculator</h2>

        <div id="display" class="screen">0</div>

        <div class="grid">
            <button class="calc-btn operator" onclick="clearAll()">AC</button>
            <button class="calc-btn operator" onclick="backspace()">DEL</button>
            <button class="calc-btn operator" onclick="append('%')">%</button>
            <button class="calc-btn operator" onclick="append('/')">÷</button>

            <button class="calc-btn" onclick="append('7')">7</button>
            <button class="calc-btn" onclick="append('8')">8</button>
            <button class="calc-btn" onclick="append('9')">9</button>
            <button class="calc-btn operator" onclick="append('*')">×</button>

            <button class="calc-btn" onclick="append('4')">4</button>
            <button class="calc-btn" onclick="append('5')">5</button>
            <button class="calc-btn" onclick="append('6')">6</button>
            <button class="calc-btn operator" onclick="append('-')">−</button>

            <button class="calc-btn" onclick="append('1')">1</button>
            <button class="calc-btn" onclick="append('2')">2</button>
            <button class="calc-btn" onclick="append('3')">3</button>
            <button class="calc-btn operator" onclick="append('+')">+</button>

            <button class="calc-btn" onclick="append('0')">0</button>
            <button class="calc-btn" onclick="append('.')">.</button>
            <button class="calc-btn operator" onclick="square()">x²</button>
            <button class="calc-btn equal" onclick="calculate()">=</button>
        </div>

    </div>

    <script>
        function showCalculator() {
            document.getElementById("calculator").style.display = "block";
            document.getElementById("openBtn").style.display = "none"; 
        }

        let display = document.getElementById("display");

        function append(value) {
            if (value === "%") {
                display.innerText += "/100"; 
                return;
            }
            if (display.innerText === "0") {
                display.innerText = value;
            } else {
                display.innerText += value;
            }
        }

        function clearAll() {
            display.innerText = "0";
        }

        function backspace() {
            display.innerText = display.innerText.slice(0, -1) || "0";
        }

        function square() {
            let num = parseFloat(display.innerText);
            display.innerText = num * num;
        }

        
        function calculate() {
            try {
                display.innerText = eval(display.innerText);
            } catch {
                display.innerText = "Error";
            }
        }
    </script>

</body>
</html>
